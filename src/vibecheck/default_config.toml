# Default Vibe Check configuration.
#
# The app treats labels as opaque strings and never parses them. This file is
# what tells it that "Purple" is a kind of "Vibrant" and a kind of "Dark" --
# change it, and a completely different vocabulary works the same way.
#
# The default vocabulary is eight colours, chosen to map onto the colour tags
# already used in DJ software (Rekordbox and others expose eight), so it fits an
# existing workflow rather than asking anyone to invent one.

[labels]
# The only labels a user ever applies by hand. Everything below is derived.
values = ["Red", "Orange", "Yellow", "Green", "Aqua", "Blue", "Purple", "Pink"]

# Coarser groupings, derived automatically from the labels above. The user never
# applies these; the app predicts them when it cannot confidently name a colour,
# because "this is Warm" is more useful than a wrong guess or silence.
[[hierarchy]]
name = "hue"
Warm    = ["Red", "Orange"]
Acidic  = ["Green", "Yellow"]
Cool    = ["Blue", "Aqua"]
Vibrant = ["Purple", "Pink"]

[[hierarchy]]
name = "tone"
Dark  = ["Red", "Green", "Blue", "Purple"]
Light = ["Orange", "Yellow", "Aqua", "Pink"]

[predict]
# The only dial: how costly it is to be misled by a wrong label.
#
# The app does not use fixed confidence thresholds. It scores every option by
# how much work it leaves the user -- how many binary choices remain -- and
# picks the cheapest:
#
#   exactly right ....................... 0
#   wrong label, right hue .............. 1 + misleading_cost
#   wrong hue, right tone ............... 2 + misleading_cost
#   wrong tone, or nothing emitted ...... 3   (+ misleading_cost if asserted)
#   emits hue and it is right ........... 1
#   emits tone and it is right .......... 2
#
# Near-misses get partial credit, so the model is pushed toward being close
# rather than boldly wrong, and the cascade (colour -> hue -> tone -> silence)
# falls out of the arithmetic instead of being hand-tuned.
#
# Measured per 100 new tracks (doing it all by hand costs 3.00/track):
#   1  -> 55 exact, 32 near, 9 wrong, 0 silent   cost 1.31   56% less work
#   2  -> 46 exact, 21 near, 5 wrong, 2 silent   cost 1.73   42% less work
#   3  -> 33 exact, 10 near, 2 wrong, 16 silent  cost 2.01   33% less work
#
# Low when you are often unsure yourself and a near-miss costs little.
# High when a wrong label you overlook is worse than a blank field.
misleading_cost = 1.0

[audio]
# Pinned, not defaulted: librosa and model preprocessing defaults drift between
# versions, and these values are part of the cache key.
sample_rate = 48000
windows = 9
window_seconds = 10.0

[model]
backend = "clap"   # laion/larger_clap_music_and_speech
