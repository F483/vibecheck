# Default Vibe Check configuration.
#
# The palette is not here. Rekordbox exposes exactly eight colour tags and six
# star ratings, and that is its UI, not a matter of taste -- it lives in
# palette.py, typed, where a statistic can reach it. What is personal is which
# track gets which colour, and that is learned rather than declared.
#
# Hue and tone are a property of those eight, not an opinion: Warm/Acidic/
# Cool/Vibrant crossed with Dark/Light is a 4x2 grid whose cells are the
# colours. A confident hue plus a confident tone *is* a colour.

[predict]
# The only dial: how costly it is to be misled by a wrong label.
#
# There are no confidence thresholds to set. Each axis knows how much of your
# decision it removes -- knowing the hue narrows eight colours to two, which is
# two binary choices -- and speaks when being right is likely enough to be
# worth the risk:
#
#   (1 - p) * (cost + misleading_cost) < cost
#
#   right ........... 0            it is decided
#   silent .......... cost         still yours to decide
#   wrong ........... cost + misleading_cost   decide it, and undo this
#
# The threshold is derived, not configured. At misleading_cost = 1 that is 33%
# for hue, 50% for tone; the axes are independent, so hue and tone can both
# speak and together name a colour.
#
# Measured on the reference collection, where naming a colour by hand costs
# 3.00 binary decisions (hue 2.00 + tone 1.00):
#   1  -> a colour on 96% of tracks, 53% right      1.35 left   55% less work
#   2  -> a colour on 41% at 67%, a hue on 17% at
#         88%, a tone on 28% at 94%                 1.81 left   40% less work
#
# Low when you are often unsure yourself and a near-miss costs little.
# High when a wrong label you overlook is worse than a blank field.
misleading_cost = 1.0

# The star rating is a separate axis with its own tolerance, because a wrong
# rating costs more than a wrong colour -- it pollutes the view you use to find
# your best tracks, where a wrong colour is just a wrong colour.
#
# Measured on 300 labels (always guessing the commonest rating = 44%):
#   1  -> rates 93% of tracks, 55% right
#   2  -> rates 45%,           65% right
#   4  -> rates 10%,           81% right
rating_misleading_cost = 4.0

[rekordbox]
# Key and energy are worked out from the audio for every track a round labels
# (and by `vibecheck analyse`), and written into the rekordbox xml with the
# colours and ratings. Nothing changes in rekordbox until you import.

# The key, alphanumeric ("8A" is A minor, "8B" C major), into rekordbox's own
# key field, so its key column and filters show it.
write_tonality = true

# "<key> - Energy <n>" at the start of the comment, replacing any earlier
# "<key> - Energy <n>" there. Everything else in the comment, /* tags */
# included, is kept.
write_comment = true

[cues]
# Cue points, written with every labelling round and by `vibecheck cues` --
# only on tracks with no cues, or with cues another tool generated ("Cue 1",
# "Cue 2", ...). A track with any cue you set yourself is never touched.
write = true

# How many bars ahead of each transition point to cue. Four transition points
# per track: the mix-in, two between, the mix-out.
#
#   [0]      one cue AT each change, hot cues A-D
#   [16, 8]  a pair 16 and 8 bars before each change, to start the next track
#            a phrase or two ahead: A/B the mix-in, C-F between, G/H the mix-out
lead = [0]

# Hot-cue slots that are loops instead of plain cues, and their length in bars,
# e.g. { A = 16, G = 16 }: room to wait at the mix-in and at the mix-out.
loops = {}

# A memory cue on every hot cue, and one on the first downbeat.
memory = true

# Learn again from your own cues once you have this many more than the model in
# use was trained on. Cues you moved count; cues left where they were written
# do not -- that would be learning from its own guesses.
retrain_after = 50

[audio]
# Pinned, not defaulted: librosa and model preprocessing defaults drift between
# versions, and these values are part of the cache key.
sample_rate = 48000
windows = 9
window_seconds = 10.0

[model]
backend = "clap"   # laion/larger_clap_music_and_speech

